<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk UMKM</title> <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc; 
        }
        /* Definisi Warna Kustom (Sama dengan Portal Utama) */
        .text-primary { color: #008080; } /* Teal/Tiruan Hijau Laut */
        .bg-primary { background-color: #008080; }
        .hover\:bg-primary-dark:hover { background-color: #006b6b; }
        
        /* Style tambahan untuk garis pembatas di bagian bawah */
        .detail-item {
            border-bottom: 1px solid #e5e7eb; /* gray-200 */
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <!-- header -->
    <header class="sticky top-0 z-50 bg-white shadow-lg">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex items-center justify-between h-20">
                <a href="#" class="flex items-center space-x-2">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span class="text-2xl font-bold text-primary">UMKM Kediri</span>
                </a>
                <div class="hidden md:flex space-x-8 font-medium">
                    <a href="../index.html#unggulan" class="text-gray-600 hover:text-primary transition duration-300">Beranda</a>
                </div>
                <button id="mobile-menu-button" class="md:hidden p-2 rounded-lg text-gray-600 hover:text-primary hover:bg-gray-100 transition duration-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </nav>
        </div>

        <div id="mobile-menu" class="hidden md:hidden absolute w-full bg-white shadow-xl py-2">
            <a href="../index.html#unggulan" class="block px-4 py-3 text-gray-800 hover:bg-gray-100">Beranda</a>
        </div>
    </header>

    <div class="container mx-auto p-4 sm:p-8 lg:p-12">
        <div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8">
            <div class="flex flex-col lg:flex-row gap-6 lg:gap-10">

                <div class="lg:w-1/3 relative flex justify-center items-start">
                    <img 
                        id="product-image"
                        src="https://placehold.co/500x500/cccccc/333333?text=Produk+Placeholder" 
                        alt="Foto Produk" 
                        class="w-full h-auto object-cover rounded-lg shadow-xl"
                    >
                    <button class="absolute top-2 right-2 bg-white/70 backdrop-blur-sm p-2 rounded-full shadow-md hover:bg-white transition duration-200" title="Perbesar Gambar">
                        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                    </button>
                </div>

                <div class="lg:w-2/3">
                    <h1 id="product-name" class="text-3xl font-extrabold text-gray-900 mb-4">Nama Produk</h1>
                    
                    <p id="product-description" class="text-gray-600 mb-8 leading-relaxed text-base">
                        Deskripsi produk akan dimuat di sini.
                    </p>

                    <div class="mb-8 space-y-2 text-sm">
                        <div class="flex">
                            <span class="w-32 font-semibold text-gray-700">Nama Owner</span>
                            <span class="w-4">:</span>
                            <span id="owner-name" class="flex-1 text-gray-800"></span>
                        </div>
                        <div class="flex">
                            <span class="w-32 font-semibold text-gray-700">Nama Usaha</span>
                            <span class="w-4">:</span>
                            <span id="umkm-name" class="flex-1 text-gray-800"></span>
                        </div>
                        <div class="flex">
                            <span class="w-32 font-semibold text-gray-700">Alamat</span>
                            <span class="w-4">:</span>
                            <span id="umkm-address" class="flex-1 text-gray-800"></span>
                        </div>
                        <div class="flex">
                            <span class="w-32 font-semibold text-gray-700">No. Hp</span>
                            <span class="w-4">:</span>
                            <span id="umkm-phone" class="flex-1 text-gray-800"></span>
                        </div>
                    </div>

                    <a id="whatsapp-link" href="#" target="_blank" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-primary shadow-lg hover:bg-primary-dark transition duration-300">
                        Hubungi UMKM
                    </a>

                    <div class="mt-8 pt-4 border-t border-gray-200">
                        <p class="text-sm text-gray-500">
                            <span class="font-semibold text-gray-700">Kategori:</span> 
                            <span id="product-category"></span>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Data UMKM Mockup (harus sama dengan di halaman utama)
        const umkmData = [
            { id: 1, name: 'Kopi Nusantara', category: 'Kuliner & Minuman', description: 'Biji kopi single origin terbaik dari pegunungan Jawa.', location: 'Ngadiluwih', owner: 'Budi Santoso', phone: '081234567890', address: 'Jl. Kopi No. 1, Ngadiluwih, Kediri', imageUrl: 'https://placehold.co/500x500/FACC15/000?text=Kopi+Nusantara' },
            { id: 2, name: 'Batik Tulis Tradisional', category: 'Fesyen & Aksesori', description: 'Kain batik tulis premium dengan motif klasik kontemporer.', location: 'Pagu', owner: 'Siti Aminah', phone: '085123456789', address: 'Jl. Batik No. 2, Pagu, Kediri', imageUrl: 'https://placehold.co/500x500/FB7185/000?text=Batik+Tulis' },
            { id: 3, name: 'Keripik Tempe Aneka Rasa', category: 'Kuliner & Minuman', description: 'Camilan keripik tempe renyah dengan rasa pedas manis.', location: 'Pare', owner: 'Agus Salim', phone: '085649408679', address: 'JL Jawa RT 01, RW 18 Tulung Rejo Pare Kediri', imageUrl: 'https://placehold.co/500x500/4ade80/000?text=Keripik+Tempe' },
            { id: 4, name: 'Jasa Desain Grafis Cepat', category: 'Jasa & Digital', description: 'Layanan desain logo dan materi promosi UMKM.', location: 'Mojo', owner: 'Dewi Lestari', phone: '081324567890', address: 'Jl. Desain No. 4, Mojo, Kediri', imageUrl: 'https://placehold.co/500x500/3B82F6/000?text=Desain+Grafis' },
            { id: 5, name: 'Tenun Ikat Sumba', category: 'Kriya & Kerajinan Tangan', description: 'Kain tenun ikat asli Sumba, 100% buatan tangan.', location: 'Semen', owner: 'Maria L', phone: '087812345678', address: 'Jl. Tenun No. 5, Semen, Kediri', imageUrl: 'https://placehold.co/500x500/A78BFA/000?text=Tenun+Sumba' },
            { id: 6, name: 'Rendang Kemasan Instan', category: 'Kuliner & Minuman', description: 'Rendang sapi siap saji, bumbu otentik Minang.', location: 'Mojoroto', owner: 'Rahmat H', phone: '082198765432', address: 'Jl. Rendang No. 6, Mojoroto, Kediri', imageUrl: 'https://placehold.co/500x500/EF4444/000?text=Rendang+Instan' },
            { id: 7, name: 'Aksesori Kulit Premium', category: 'Fesyen & Aksesori', description: 'Dompet dan tas kulit sapi kualitas ekspor.', location: 'Ngasem', owner: 'Putri Ayu', phone: '089678901234', address: 'Jl. Kulit No. 7, Ngasem, Kediri', imageUrl: 'https://placehold.co/500x500/F472B6/000?text=Aksesori+Kulit' },
            { id: 8, name: 'Madu Hutan Murni', category: 'Kuliner & Minuman', description: 'Madu asli dari hutan liar Kalimantan tanpa campuran.', location: 'Pesantren', owner: 'Joko S', phone: '081122334455', address: 'Jl. Madu No. 8, Pesantren, Kediri', imageUrl: 'https://placehold.co/500x500/6D28D9/000?text=Madu+Hutan' },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Dapatkan nama file dari URL (misal: "kopi-nusantara.html")
            const pathSegments = window.location.pathname.split('/');
            const fileNameWithExtension = pathSegments[pathSegments.length - 1]; // "kopi-nusantara.html"
            const productNameSlug = fileNameWithExtension.replace('.html', ''); // "kopi-nusantara"

            // Ubah slug kembali ke format nama yang bisa dicari (misal: "Kopi Nusantara")
            const expectedProductName = productNameSlug.replace(/-/g, ' ').split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');

            // Temukan produk yang sesuai dari umkmData
            const product = umkmData.find(item => item.name === expectedProductName);

            if (product) {
                // Perbarui judul halaman
                document.title = product.name;

                // Perbarui elemen-elemen HTML dengan data produk
                document.getElementById('product-image').src = product.imageUrl;
                document.getElementById('product-image').alt = `Foto Produk ${product.name}`;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-description').textContent = product.description;
                document.getElementById('owner-name').textContent = product.owner || 'Tidak tersedia';
                document.getElementById('umkm-name').textContent = product.name; // Asumsi nama usaha sama dengan nama produk
                document.getElementById('umkm-address').textContent = product.address || 'Tidak tersedia';
                document.getElementById('umkm-phone').textContent = product.phone || 'Tidak tersedia';
                document.getElementById('product-category').textContent = `${product.location}, ${product.category}`;

                // Perbarui link WhatsApp
                const whatsappLink = document.getElementById('whatsapp-link');
                whatsappLink.href = `https://wa.me/${product.phone.replace(/\D/g, '')}`; // Hanya angka
            } else {
                // Jika produk tidak ditemukan, tampilkan pesan error atau redirect
                document.title = "Produk Tidak Ditemukan";
                document.querySelector('.container').innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl p-8 text-center">
                        <h2 class="text-2xl font-bold text-red-600 mb-4">Produk Tidak Ditemukan</h2>
                        <p class="text-gray-600">Maaf, detail produk yang Anda cari tidak dapat ditemukan.</p>
                        <a href="index.html" class="mt-6 inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-primary shadow-lg hover:bg-primary-dark transition duration-300">
                            Kembali ke Beranda
                        </a>
                    </div>
                `;
            }
        });
    </script>

</body>
</html>
